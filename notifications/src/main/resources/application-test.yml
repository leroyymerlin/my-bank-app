spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: true

  kafka:
    consumer:
      bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.as.string: true
        spring.json.key.as.string: true
    producer:
      bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

kafka:
  dlt:
    name: "notifications-service.dlt"
