server:
  port: 8082

spring:
  application:
    name: accounts-service

  datasource:
    url: jdbc:postgresql://localhost:5432/accounts_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/myrealm   # URL Keycloak
      client:
        registration:
          notification-client:
            client-id: accounts-client
            client-secret: your-client-secret
            authorization-grant-type: client_credentials
            scope: notification
        provider:
          notification-client:
            token-uri: http://localhost:8080/auth/realms/myrealm/protocol/openid-connect/token

notification:
  service:
    url: http://localhost:8081

logging:
  level:
    org.springframework.security: DEBUG
    org.apache.kafka: DEBUG