server:
  port: 8082

spring:
  application:
    name: accounts-service

  datasource:
    url: jdbc:postgresql://localhost:5432/accounts_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        interceptor.classes: ru.yandex.practicum.config.TracingKafkaProducerInterceptor

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/myrealm
      client:
        registration:
          notification-client:
            client-id: accounts-client
            client-secret: your-client-secret
            authorization-grant-type: client_credentials
            scope: notification
        provider:
          notification-client:
            token-uri: http://localhost:8080/auth/realms/myrealm/protocol/openid-connect/token

notification:
  service:
    url: http://localhost:8081

logging:
  level:
    org.springframework.security: DEBUG
    org.apache.kafka: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} -- %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} -- %msg%n"
  file:
    name: /var/log/accounts-service.log

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  observations:
    keyvalues:
      service.name: accounts-service
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true

zipkin:
  base-url: http://zipkin:9411

# Configuration для retry обновления баланса
balance:
  update:
    retries: 3
    backoff:
      delay: 100
      multiplier: 2.0
      max: 2000
