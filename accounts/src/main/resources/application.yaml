server:
  port: 8082

spring:
  application:
    name: accounts-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/accounts_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/myrealm}
      client:
        registration:
          notification-client:
            client-id: ${OAUTH2_CLIENT_REGISTRATION_NOTIFICATION_CLIENT_CLIENT_ID:accounts-client}
            client-secret: ${OAUTH2_CLIENT_REGISTRATION_NOTIFICATION_CLIENT_CLIENT_SECRET:change-me}
            authorization-grant-type: client_credentials
            scope: notification
        provider:
          notification-client:
            token-uri: ${OAUTH2_CLIENT_REGISTRATION_NOTIFICATION_CLIENT_TOKEN_URI:http://keycloak:8080/realms/myrealm/protocol/openid-connect/token}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notifications:8085}

logging:
  level:
    org.springframework.security: DEBUG
    org.apache.kafka: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} -- %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} -- %msg%n"
  file:
    name: /var/log/accounts-service.log

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  observations:
    keyvalues:
      service.name: accounts-service
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

balance:
  update:
    retries: 3
    backoff:
      delay: 100
      multiplier: 2.0
      max: 2000
