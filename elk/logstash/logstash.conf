input {
  # Собираем логи со всех микросервисов через TCP
  tcp {
    port => 5000
    codec => json
    host => "microservices"
  }

  # Собираем логи через UDP
  udp {
    port => 5001
    codec => json
    host => "microservices"
  }

  # Собираем логи Frontend (Front UI)
  file {
    path => "/var/log/front/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json {
      tags => ["front-ui"]
    }
  }
}

filter {
  # Обработка логов Spring Boot
  if "microservices" in [host] {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:loglevel}%{SPACE}[%{DATA:thread}]%{SPACE}(%{JAVACLASS:logger})?%{SPACE}--%{SPACE}%{GREEDYDATA:log_message}"
      }
    }

    mutate {
      uppercase => ["loglevel"]
    }

    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
    }

    mutate {
      add_tag => ["sensitive-data"]
    }

    if "event" in [message] and "login" in [message] {
      grok {
        match => { "message" => ".*login.*?(?<login_plain>[a-zA-Z0-9_]+).*" }
      }
      if "_grokparsefailure" not in [tags] {
        mutate {
          replace => { "login_masked" => "***%{login_plain[2,]}" }
        }
      }
    }

    if "log_message" in [message] {
      grok {
        match => { "log_message" => ".*balance.*%{NUMBER:balance}.*" }
      }
      if "_grokparsefailure" not in [tags] {
        mutate {
          gsub => [
            "log_message", "([0-9]+\\.[0-9]{2})", "***"
          ]
        }
      }
    }

    mutate {
      gsub => [
        "log_message", "([0-9]+\\.[0-9]{2})", "***"
      ]
    }

    if "service" not in [tags] {
      mutate {
        add_tag => ["spring-boot"]
      }
    }
  }

  # Обработка логов Frontend
  if "front-ui" in [tags] {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:loglevel}%{SPACE}[%{DATA:thread}]%{SPACE}(%{JAVACLASS:logger})?%{SPACE}--%{SPACE}%{GREEDYDATA:log_message}"
      }
    }

    mutate {
      uppercase => ["loglevel"]
    }

    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
    }
  }

  # Фильтрация дубликатов логов
  mutate {
    remove_field => ["@version", "host"]
  }
}

output {
  # Отправка в Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "banking-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    
    template_overwrite => true
    
    doc_as_upsert => true
  }

  stdout {
    codec => rubydebug
  }
}
