input {
  tcp {
    port => 5000
    codec => json
  }

  udp {
    port => 5001
    codec => json
  }

  beats {
    port => 5044
  }
}

filter {
  if "microservices" in [host] {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:loglevel}%{SPACE}[%{DATA:thread}]%{SPACE}(?:%{JAVACLASS:logger})?%{SPACE}--%{SPACE}%{GREEDYDATA:log_message}"
      }
    }

    mutate {
      uppercase => ["loglevel"]
    }

    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
    }

    mutate {
      add_tag => ["spring-boot"]
    }
  }

  if [agent][type] == "container" {
    mutate {
      add_tag => ["filebeat"]
    }
  }

  if "log_message" in [message] {
    mutate {
      gsub => [
        "log_message", "([0-9]+\\.[0-9]{2})", "***"
      ]
    }
  }

  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "banking-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
