apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-postgresql
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgresql
    component: {{ .Chart.Name }}
spec:
  type: {{ .Values.global.postgresql.service.type }}
  ports:
    - port: {{ .Values.global.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
      name: tcp
  selector:
    app: postgresql
    component: {{ .Chart.Name }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-postgresql
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgresql
    component: {{ .Chart.Name }}
spec:
  serviceName: {{ .Release.Name }}-{{ .Chart.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: {{ .Chart.Name }}
    spec:
      containers:
        - name: postgresql
          image: "postgres:15-alpine"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5432
              name: tcp
          resources:
            {{- toYaml .Values.global.postgresql.resources | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "notifications_db"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "pg_ctl -D /var/lib/postgresql/data/pgdata stop -m fast"]
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
