# ===== ELK Stack =====
# Note: elk chart contains multiple components.
# Each component has its own values section below.
# The template uses .Values directly (subchart values root).

elasticsearch:
  enabled: true
  replicaCount: 1
  imagePullPolicy: IfNotPresent
  image:
    tag: "8.13.0"
  service:
    type: ClusterIP
    port: 9200
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    size: 5Gi
  config: |
    cluster.name: elk-cluster
    node.name: elasticsearch-1
    network.host: 0.0.0.0
    http.port: 9200
    http.cors.enabled: true
    http.cors.allow-origin: "*"
    http.cors.allow-headers: Authorization,X-Requested-With,Content-Length,Content-Type
    xpack.security.enabled: false
    discovery.type: single-node
    path.data: /usr/share/elasticsearch/data
    path.logs: /usr/share/elasticsearch/logs
    bootstrap.memory_lock: true

logstash:
  enabled: true
  replicaCount: 1
  imagePullPolicy: IfNotPresent
  image:
    tag: "8.13.0"
  service:
    type: ClusterIP
    ports:
      - name: tcp
        port: 5000
        targetPort: 5000
        protocol: TCP
      - name: udp
        port: 5001
        targetPort: 5001
        protocol: UDP
      - name: beats
        port: 5044
        targetPort: 5044
        protocol: TCP
  resources:
    requests:
      memory: "256Mi"
      cpu: "125m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  config: |
    pipeline.workers: 2
    pipeline.batch.size: 125
    pipeline.batch.delay: 50
  pipeline: |
    input {
      tcp {
        port => 5000
        codec => json
      }
      udp {
        port => 5001
        codec => json
      }
      beats {
        port => 5044
      }
    }
    filter {
      if "microservices" in [host] {
        grok {
          match => {
            "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:loglevel}%{SPACE}[%{DATA:thread}]%{SPACE}(?:%{JAVACLASS:logger})?%{SPACE}--%{SPACE}%{GREEDYDATA:log_message}"
          }
        }
        mutate {
          uppercase => ["loglevel"]
        }
        date {
          match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS"]
          target => "@timestamp"
        }
        mutate {
          add_tag => ["spring-boot"]
        }
      }
      mutate {
        remove_field => ["@version"]
      }
    }
    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "banking-logs-%{+YYYY.MM.dd}"
      }
      stdout {
        codec => rubydebug
      }
    }

kibana:
  enabled: true
  replicaCount: 1
  imagePullPolicy: IfNotPresent
  image:
    tag: "8.13.0"
  service:
    type: ClusterIP
    port: 5601
  resources:
    requests:
      memory: "256Mi"
      cpu: "125m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  config: |
    server.name: kibana
    server.host: "0.0.0.0"
    elasticsearch.hosts: ["http://elasticsearch:9200"]
    elasticsearch.requestTimeout: 30000
    logging.verbose: false
    xpack.security.enabled: false
