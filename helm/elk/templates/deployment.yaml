apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-elasticsearch
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
  labels:
    app: elasticsearch
spec:
  replicas: {{ .Values.elk.elasticsearch.replicaCount }}
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: "elasticsearch:{{ .Values.elk.elasticsearch.image.tag | default "8.13.0" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.elk.elasticsearch.resources.requests.memory }} -Xmx{{ .Values.elk.elasticsearch.resources.limits.memory }}"
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              memory: {{ .Values.elk.elasticsearch.resources.requests.memory }}
              cpu: {{ .Values.elk.elasticsearch.resources.requests.cpu }}
            limits:
              memory: {{ .Values.elk.elasticsearch.resources.limits.memory }}
              cpu: {{ .Values.elk.elasticsearch.resources.limits.cpu }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-elasticsearch-pvc
        - name: config
          configMap:
            name: {{ .Release.Name }}-elasticsearch-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-elasticsearch-config
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
data:
  elasticsearch.yml: |
{{ .Values.elk.elasticsearch.config | toYaml | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-elasticsearch-pvc
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.elk.elasticsearch.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
  labels:
    app: elasticsearch
spec:
  type: {{ .Values.elk.elasticsearch.service.type }}
  ports:
    - port: {{ .Values.elk.elasticsearch.service.port }}
      targetPort: 9200
      protocol: TCP
      name: http
  selector:
    app: elasticsearch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-logstash
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
  labels:
    app: logstash
spec:
  replicas: {{ .Values.elk.logstash.replicaCount }}
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: "logstash:{{ .Values.elk.logstash.image.tag | default "8.13.0" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 5000
              name: tcp
            - containerPort: 5001
              name: udp
            - containerPort: 5044
              name: beats
          resources:
            requests:
              memory: {{ .Values.elk.logstash.resources.requests.memory }}
              cpu: {{ .Values.elk.logstash.resources.requests.cpu }}
            limits:
              memory: {{ .Values.elk.logstash.resources.limits.memory }}
              cpu: {{ .Values.elk.logstash.resources.limits.cpu }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-logstash-config
        - name: pipeline
          configMap:
            name: {{ .Release.Name }}-logstash-pipeline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-logstash-config
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
data:
  logstash.yml: |
{{ .Values.elk.logstash.config | toYaml | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-logstash-pipeline
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
data:
  logstash.conf: |
{{ .Values.elk.logstash.pipeline | toYaml | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
  labels:
    app: logstash
spec:
  type: {{ .Values.elk.logstash.service.type }}
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: tcp
    - port: 5001
      targetPort: 5001
      protocol: UDP
      name: udp
    - port: 5044
      targetPort: 5044
      protocol: TCP
      name: beats
  selector:
    app: logstash
