apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-loki
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
  labels:
    app: loki
spec:
  replicas: {{ .Values.elk.loki.replicaCount }}
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: "grafana/loki:{{ .Values.elk.loki.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          args:
            - "-config.file=/etc/loki/local-config.yaml"
          ports:
            - containerPort: 3100
              name: http
          resources:
            requests:
              memory: {{ .Values.elk.loki.resources.requests.memory }}
              cpu: {{ .Values.elk.loki.resources.requests.cpu }}
            limits:
              memory: {{ .Values.elk.loki.resources.limits.memory }}
              cpu: {{ .Values.elk.loki.resources.limits.cpu }}
          volumeMounts:
            - name: config
              mountPath: /etc/loki/local-config.yaml
              subPath: loki-config.yaml
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-loki-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-loki-config
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
data:
  loki-config.yaml: |
{{ .Values.elk.loki.config | toYaml | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Values.global.namespace | default "my-bank-app" }}
  labels:
    app: loki
spec:
  type: {{ .Values.elk.loki.service.type }}
  ports:
    - port: {{ .Values.elk.loki.service.port }}
      targetPort: 3100
      protocol: TCP
      name: http
  selector:
    app: loki
