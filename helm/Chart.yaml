apiVersion: v2
name: my-bank-app
description: Zonchik Helm-chart for My Bank Application
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: accounts
    version: 1.0.0
    condition: accounts.enabled
  - name: cash
    version: 1.0.0
    condition: cash.enabled
  - name: transfer
    version: 1.0.0
    condition: transfer.enabled
  - name: notifications
    version: 1.0.0
    condition: notifications.enabled
  - name: gateway
    version: 1.0.0
    condition: gateway.enabled
  - name: front
    version: 1.0.0
    condition: front.enabled
