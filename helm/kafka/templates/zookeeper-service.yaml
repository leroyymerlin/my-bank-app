apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-zookeeper
  labels:
    app: zookeeper
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.zookeeper.port }}
      targetPort: {{ .Values.zookeeper.port }}
      protocol: TCP
      name: zookeeper
  selector:
    app: zookeeper
