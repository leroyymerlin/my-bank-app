apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-transfer
  namespace: {{ .Values.global.namespace }}
  labels:
    app: transfer
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: transfer
  template:
    metadata:
      labels:
        app: transfer
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-{{ .Chart.Name }}-postgresql 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: transfer
          image: "my-bank-app/transfer:latest"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8084
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ .Release.Name }}-{{ .Chart.Name }}-postgresql:5432/transfer_db
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ .Values.global.keycloak.issuerUri | default (printf "http://%s-keycloak:8080/realms/myrealm" .Release.Name) }}
            - name: ACCOUNT_SERVICE_URL
              value: http://{{ .Release.Name }}-gateway:8081
            - name: NOTIFICATION_SERVICE_URL
              value: http://{{ .Release.Name }}-gateway:8081
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Release.Name }}-kafka:9092"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]