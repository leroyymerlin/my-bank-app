apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-transfer
  namespace: {{ .Release.Namespace }}
  labels:
    app: transfer
spec:
  type: {{ .Values.transfer.service.type }}
  ports:
    - port: {{ .Values.transfer.service.port }}
      targetPort: 8084
      protocol: TCP
      name: http
  selector:
    app: transfer
