# ===== Global Settings =====
global:
  imagePullPolicy: IfNotPresent
  namespace: my-bank-app

  # ===== Keycloak =====
  # When global.keycloak.enabled=true, uses the bundled Keycloak chart
  # When global.keycloak.enabled=false, set issuerUri to external Keycloak URL
  keycloak:
    enabled: true
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    issuerUri: ""

# ===== Bitnami Keycloak =====
keycloak:
  auth:
    adminUser: admin
    adminPassword: admin123
    existingSecret: ""
    existingSecretPasswordKey: ""
  tls:
    enabled: false
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  # ===== PostgreSQL =====
  postgresql:
    enabled: true
    service:
      type: ClusterIP
      port: 5432
    resources:
      requests:
        memory: "256Mi"
        cpu: "125m"
      limits:
        memory: "512Mi"
        cpu: "250m"

# ===== Kafka =====
kafka:
  enabled: true
  replicaCount: 1
  image: confluentinc/cp-kafka:7.5.0
  ports:
    internal: 9092
    external: 9093
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 5Gi
  zookeeper:
    enabled: true
    port: 2181
    image: confluentinc/cp-zookeeper:7.5.0
    resources:
      requests:
        memory: "256Mi"
        cpu: "125m"
      limits:
        memory: "512Mi"
        cpu: "250m"
    persistence:
      size: 1Gi
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
  topics:
    - name: cash-notifications
      partitions: 3
      replicationFactor: 1
    - name: transfer-notifications
      partitions: 3
      replicationFactor: 1
    - name: account-notifications
      partitions: 3
      replicationFactor: 1

# ===== Gateway =====
gateway:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

