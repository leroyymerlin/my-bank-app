# ===== Global Settings =====
imagePullPolicy: IfNotPresent
namespace: my-bank-app

# ===== Keycloak =====
keycloak:
  enabled: true
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ===== PostgreSQL =====
postgresql:
  enabled: true
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      memory: "256Mi"
      cpu: "125m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# ===== Gateway =====
gateway:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ===== Accounts Service =====
accounts:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ===== Cash Service =====
cash:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ===== Transfer Service =====
transfer:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8084
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ===== Notifications Service =====
notifications:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8085
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ===== Front =====
front:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
