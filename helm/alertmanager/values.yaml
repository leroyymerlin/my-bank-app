# ===== AlertManager =====
replicaCount: 1

imagePullPolicy: IfNotPresent

image:
  tag: "v0.27.0"

service:
  type: ClusterIP
  port: 9093

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

persistence:
  size: 1Gi

config: |
  global:
    resolve_timeout: 5m
  route:
    group_by: ['alertname', 'service']
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 5m
    receiver: 'default-receiver'
    routes:
      - match:
          severity: critical
        receiver: 'critical-receiver'
        repeat_interval: 1m
      - match:
          severity: warning
        receiver: 'default-receiver'
        repeat_interval: 5m
  receivers:
    - name: 'default-receiver'
      webhook_configs:
        - url: 'http://alertmanager-webhook:5001/webhook'
          send_resolved: true
    - name: 'critical-receiver'
      webhook_configs:
        - url: 'http://alertmanager-webhook:5001/webhook'
          send_resolved: true
  inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'service']
