server:
  port: 8084

spring:
  application:
    name: transfer-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      enable-auto-commit: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/myrealm
      client:
        registration:
          transfer-client:
            client-id: transfer-client
            client-secret: your-client-secret
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          transfer-client:
            token-uri: http://localhost:8080/auth/realms/myrealm/protocol/openid-connect/token

account:
  service:
    url: http://localhost:8082

notification:
  service:
    url: http://localhost:8085

logging:
  level:
    org.springframework.security: DEBUG
    org.apache.kafka: DEBUG

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  observations:
    keyvalues:
      service.name: transfer-service
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
