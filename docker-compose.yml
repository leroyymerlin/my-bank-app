version: '3.8'

services:
  # ========== ИНФРАСТРУКТУРА ==========

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json   # если есть файл с realm
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/myrealm"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # ========== МИКРОСЕРВИСЫ ==========

  accounts:
    build:
      context: ./accounts
      dockerfile: Dockerfile
    container_name: accounts
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accounts_db?currentSchema=accounts_schema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/myrealm
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_NOTIFICATION_CLIENT_TOKEN_URI: http://keycloak:8080/realms/myrealm/protocol/openid-connect/token
      NOTIFICATION_SERVICE_URL: http://gateway:8081
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  cash:
    build:
      context: ./cash
      dockerfile: Dockerfile
    container_name: cash
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/myrealm
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_CASH_CLIENT_TOKEN_URI: http://keycloak:8080/realms/myrealm/protocol/openid-connect/token
      ACCOUNT_SERVICE_URL: http://gateway:8081
      NOTIFICATION_SERVICE_URL: http://gateway:8081
    depends_on:
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - app-network

  transfer:
    build:
      context: ./transfer
      dockerfile: Dockerfile
    container_name: transfer
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/myrealm
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_TRANSFER_CLIENT_TOKEN_URI: http://keycloak:8080/realms/myrealm/protocol/openid-connect/token
      ACCOUNT_SERVICE_URL: http://gateway:8081
      NOTIFICATION_SERVICE_URL: http://gateway:8081
    depends_on:
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - app-network

  notifications:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    container_name: notifications
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/myrealm
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://accounts:8082
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://cash:8083
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://transfer:8084
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://notifications:8085
    ports:
      - "8081:8081"
    networks:
      - app-network

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front
    environment:
      GATEWAY_URL: http://gateway:8081
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/myrealm
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - app-network
